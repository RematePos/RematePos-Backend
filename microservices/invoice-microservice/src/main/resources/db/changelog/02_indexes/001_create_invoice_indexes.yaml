databaseChangeLog:
  - changeSet:
      id: hu-178b-invoice-index-invoices-tenant
      author: codex
      preConditions:
        onFail: MARK_RAN
        and:
          - tableExists:
              tableName: invoices
          - not:
              indexExists:
                indexName: idx_invoices_tenant_id
      changes:
        - createIndex:
            tableName: invoices
            indexName: idx_invoices_tenant_id
            columns:
              - column:
                  name: tenant_id
      rollback: []

