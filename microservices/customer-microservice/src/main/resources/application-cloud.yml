spring:
  config:
    import: ${SPRING_CONFIG_IMPORT:optional:configserver:${CONFIG_SERVER_URL:http://rematepos-config-server.onrender.com}}
  cloud:
    config:
      fail-fast: ${SPRING_CLOUD_CONFIG_FAIL_FAST:false}
    discovery:
      enabled: ${SPRING_CLOUD_DISCOVERY_ENABLED:false}
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:${SPRING_MONGODB_URI:mongodb://localhost:27017/customer_db}}
      database: ${CUSTOMER_DB_NAME:customer_db}
      auto-index-creation: false

server:
  port: ${PORT:${SERVER_PORT:8091}}

customers:
  api-base-path: /api/v1/customers

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://rematepos-frontend.onrender.com,http://localhost:3000,http://localhost:3001,http://localhost:3002}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

eureka:
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:false}
    register-with-eureka: false
    fetch-registry: false
    serviceUrl:
      defaultZone: ${EUREKA_SERVER_URL:${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}}
