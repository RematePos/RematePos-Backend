              tableName: categories
              columnName: tenant_id
          - not:
              indexExists:
                indexName: idx_categories_tenant_id
      changes:
        - createIndex:
            tableName: categories
            indexName: idx_categories_tenant_id
            columns:
              - column:
                  name: tenant_id
      rollback: []

  - changeSet:
      id: hu-178b-product-index-categories-tenant-name
      author: codex
      preConditions:
        onFail: MARK_RAN
        and:
          - tableExists:
              tableName: categories
          - columnExists:
              tableName: categories
              columnName: tenant_id
          - not:
              indexExists:
                indexName: idx_categories_tenant_name
      changes:
        - createIndex:
            tableName: categories
            indexName: idx_categories_tenant_name
            columns:
              - column:
                  name: tenant_id
              - column:
                  name: name
      rollback: []
