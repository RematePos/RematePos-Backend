services:

  config-server:
    build:
      context: ../../..
      dockerfile: config-server/Dockerfile
    ports:
      - "${CONFIG_SERVER_PORT}:8888"
    environment:
      - MONGO_DB_USERNAME=${MONGO_DB_USERNAME:-admin}
      - MONGO_DB_PASSWORD=${MONGO_DB_PASSWORD:-example_mongo_password}
      - MONGO_HOST=${MONGO_HOST:-host.docker.internal}
      - MONGO_DB_PORT=${MONGO_DB_PORT:-27017}
      - POSTGRESQL_HOST=${POSTGRESQL_HOST:-host.docker.internal}
      - POSTGRESQL_DB_PORT=${POSTGRESQL_DB_PORT:-5433}
      - POSTGRESQL_DB_USERNAME=${POSTGRESQL_DB_USERNAME:-postgres}
      - POSTGRESQL_DB_PASSWORD=${POSTGRESQL_DB_PASSWORD:-example_postgres_password}
      - CUSTOMER_DB_NAME=${CUSTOMER_DB_NAME:-customer_db}
      - CART_DB_NAME=${CART_DB_NAME:-cart_db}
      - PRODUCT_DB_NAME=${PRODUCT_DB_NAME:-product_db}
      - AUTH_DB_NAME=${AUTH_DB_NAME:-auth_db}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION_MS=${JWT_EXPIRATION_MS:-3600000}
      - AUTH_DEMO_REGISTRATION_ENABLED=${AUTH_DEMO_REGISTRATION_ENABLED:-false}
      - AUTH_SEED_DEMO_USERS=${AUTH_SEED_DEMO_USERS:-false}
      - AUTH_DEMO_ADMIN_PASSWORD=${AUTH_DEMO_ADMIN_PASSWORD:-}
      - AUTH_DEMO_CASHIER_PASSWORD=${AUTH_DEMO_CASHIER_PASSWORD:-}
      - AUTH_SEED_PLATFORM_ADMIN=${AUTH_SEED_PLATFORM_ADMIN:-false}
      - AUTH_PLATFORM_ADMIN_USERNAME=${AUTH_PLATFORM_ADMIN_USERNAME:-platform.admin}
      - AUTH_PLATFORM_ADMIN_PASSWORD=${AUTH_PLATFORM_ADMIN_PASSWORD:-}
      - AUTH_PLATFORM_ADMIN_EMAIL=${AUTH_PLATFORM_ADMIN_EMAIL:-platform.admin@example.com}
    networks:
      - microservices
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8888/actuator/health" ]
      interval: 20s
      timeout: 3s
      retries: 5
    restart: on-failure

  discovery-server:
    build:
      context: ../../..
      dockerfile: discovery-server/Dockerfile
    depends_on:
      config-server:
        condition: service_healthy
    ports:
      - "${EUREKA_SERVER_PORT}:8761"
    environment:
      - SPRING_CONFIG_IMPORT=configserver:http://config-server:8888
    networks:
      - microservices
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8761/actuator/health" ]
      interval: 20s
      timeout: 3s
      retries: 5
    restart: on-failure

  api-gateway:
    build:
      context: ../../..
      dockerfile: api-gateway/Dockerfile
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    ports:
      - "${API_GATEWAY_PORT}:8080"
    environment:
      - SPRING_CONFIG_IMPORT=configserver:http://config-server:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - CUSTOMER_SERVICE_URL=http://customer-microservice:8091
      - PRODUCT_SERVICE_URL=http://product-microservice:8092
      - CART_SERVICE_URL=http://cart-microservice:8093
      - AUTH_SERVICE_URL=http://auth-microservice:8096
      - SERVICES_AUTH_URL=http://auth-microservice:8096
      - PURCHASE_SERVICE_URL=http://purchase-microservice:8094
      - INVOICE_SERVICE_URL=http://invoice-microservice:8095
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    networks:
      - microservices
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/actuator/health" ]
      interval: 20s
      timeout: 3s
      retries: 5
    restart: on-failure

  customer-microservice:
    build:
      context: ../../..
      dockerfile: microservices/customer-microservice/Dockerfile
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    ports:
      - "${CUSTOMER_MICROSERVICE_PORT}:8091"
    environment:
      - SPRING_CONFIG_IMPORT=configserver:http://config-server:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - SPRING_MONGODB_URI=${CUSTOMER_MONGODB_URI:-mongodb://${MONGO_DB_USERNAME:-admin}:${MONGO_DB_PASSWORD:-example_mongo_password}@${MONGO_HOST:-host.docker.internal}:${MONGO_DB_PORT:-27017}/${CUSTOMER_DB_NAME:-customer_db}?authSource=admin}
    networks:
      - microservices

  product-microservice:
    build:
      context: ../../..
      dockerfile: microservices/product-microservice/Dockerfile
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    ports:
      - "${PRODUCT_MICROSERVICE_PORT}:8092"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://${POSTGRESQL_HOST}:${POSTGRESQL_DB_PORT}/${PRODUCT_DB_NAME}
      - SPRING_DATASOURCE_USERNAME=${POSTGRESQL_DB_USERNAME:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRESQL_DB_PASSWORD:-example_postgres_password}
      - JPA_DDL_AUTO=${JPA_DDL_AUTO:-update}
      - LIQUIBASE_ENABLED=${LIQUIBASE_ENABLED:-true}
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN}
      - BILLING_PROVIDER=${BILLING_PROVIDER:-MOCK_DIAN}
      - BILLING_ENVIRONMENT=${BILLING_ENVIRONMENT:-DEMO}
      - BILLING_DEMO_LEGEND=${BILLING_DEMO_LEGEND:-Documento generado en ambiente de demostración, sin validez tributaria.}
      - FACTUS_API_BASE_URL=${FACTUS_API_BASE_URL:-}
      - FACTUS_API_KEY=${FACTUS_API_KEY:-}
      - FACTUS_CLIENT_ID=${FACTUS_CLIENT_ID:-}
      - FACTUS_CLIENT_SECRET=${FACTUS_CLIENT_SECRET:-}
      - SPRING_CONFIG_IMPORT=configserver:http://config-server:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
    networks:
      - microservices

  cart-microservice:
    build:
      context: ../../..
      dockerfile: microservices/cart-microservice/Dockerfile
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    ports:
      - "${CART_MICROSERVICE_PORT}:8093"
    environment:
      - SPRING_CONFIG_IMPORT=configserver:http://config-server:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - SPRING_MONGODB_URI=${CART_MONGODB_URI:-mongodb://${MONGO_DB_USERNAME:-admin}:${MONGO_DB_PASSWORD:-example_mongo_password}@${MONGO_HOST:-host.docker.internal}:${MONGO_DB_PORT:-27017}/${CART_DB_NAME:-cart_db}?authSource=admin}
    networks:
      - microservices

  auth-microservice:
    build:
      context: ../../..
      dockerfile: microservices/auth-microservice/Dockerfile
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    ports:
      - "${AUTH_MICROSERVICE_PORT}:8096"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://${POSTGRESQL_HOST}:${POSTGRESQL_DB_PORT}/${AUTH_DB_NAME}
      - SPRING_DATASOURCE_USERNAME=${POSTGRESQL_DB_USERNAME:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRESQL_DB_PASSWORD:-example_postgres_password}
      - JPA_DDL_AUTO=${JPA_DDL_AUTO:-update}
      - LIQUIBASE_ENABLED=${LIQUIBASE_ENABLED:-true}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION_MS=${JWT_EXPIRATION_MS:-3600000}
      - AUTH_DEMO_REGISTRATION_ENABLED=${AUTH_DEMO_REGISTRATION_ENABLED:-false}
      - AUTH_SEED_DEMO_USERS=${AUTH_SEED_DEMO_USERS:-false}
      - AUTH_DEMO_ADMIN_PASSWORD=${AUTH_DEMO_ADMIN_PASSWORD:-}
      - AUTH_DEMO_CASHIER_PASSWORD=${AUTH_DEMO_CASHIER_PASSWORD:-}
      - AUTH_SEED_PLATFORM_ADMIN=${AUTH_SEED_PLATFORM_ADMIN:-false}
      - AUTH_PLATFORM_ADMIN_USERNAME=${AUTH_PLATFORM_ADMIN_USERNAME:-platform.admin}
      - AUTH_PLATFORM_ADMIN_PASSWORD=${AUTH_PLATFORM_ADMIN_PASSWORD:-}
      - AUTH_PLATFORM_ADMIN_EMAIL=${AUTH_PLATFORM_ADMIN_EMAIL:-platform.admin@example.com}
      - SPRING_CONFIG_IMPORT=configserver:http://config-server:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
    networks:
      - microservices

  purchase-microservice:
    build:
      context: ../../..
      dockerfile: microservices/purchase-microservice/Dockerfile
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      customer-microservice:
        condition: service_started
      product-microservice:
        condition: service_started
    ports:
      - "${PURCHASE_MICROSERVICE_PORT}:8094"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://${POSTGRESQL_HOST}:${POSTGRESQL_DB_PORT}/${PURCHASE_DB_NAME}
      - SPRING_DATASOURCE_USERNAME=${POSTGRESQL_DB_USERNAME:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRESQL_DB_PASSWORD:-example_postgres_password}
      - JPA_DDL_AUTO=${JPA_DDL_AUTO:-update}
      - LIQUIBASE_ENABLED=${LIQUIBASE_ENABLED:-true}
      - CUSTOMER_SERVICE_URL=http://customer-microservice:8091
      - PRODUCT_SERVICE_URL=http://product-microservice:8092
      - INVOICE_SERVICE_URL=http://invoice-microservice:8095
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN}
      - SPRING_CONFIG_IMPORT=configserver:http://config-server:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
    networks:
      - microservices

  invoice-microservice:
    build:
      context: ../../..
      dockerfile: microservices/invoice-microservice/Dockerfile
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    ports:
      - "${INVOICE_MICROSERVICE_PORT}:8095"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://${POSTGRESQL_HOST}:${POSTGRESQL_DB_PORT}/${INVOICE_DB_NAME}
      - SPRING_DATASOURCE_USERNAME=${POSTGRESQL_DB_USERNAME:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRESQL_DB_PASSWORD:-example_postgres_password}
      - JPA_DDL_AUTO=${JPA_DDL_AUTO:-update}
      - LIQUIBASE_ENABLED=${LIQUIBASE_ENABLED:-true}
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN}
      - SPRING_CONFIG_IMPORT=configserver:http://config-server:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
    networks:
      - microservices



networks:
  microservices:
    driver: bridge
