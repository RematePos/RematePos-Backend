spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${POSTGRESQL_HOST:localhost}:${POSTGRESQL_PORT:${POSTGRESQL_DB_PORT:5432}}/${PURCHASE_DB_NAME:purchase_db}}
    username: ${SPRING_DATASOURCE_USERNAME:${POSTGRESQL_DB_USERNAME:}}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRESQL_DB_PASSWORD:}}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  liquibase:
    enabled: ${LIQUIBASE_ENABLED:true}
    change-log: classpath:db/changelog/db.changelog-master.yaml

services:
  customer:
    url: ${CUSTOMER_SERVICE_URL:https://tematepos-customer.onrender.com}
  product:
    url: ${PRODUCT_SERVICE_URL:http://localhost:8092}
  invoice:
    url: ${INVOICE_SERVICE_URL:http://localhost:8095}

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_SERVER_URL:${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}}

server:
  port: ${PORT:${PURCHASE_MICROSERVICE_PORT:8094}}
