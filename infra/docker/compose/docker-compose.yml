services:

  config-server:
    build:
      context: ../../..
      dockerfile: config-server/Dockerfile
    ports:
      - "${CONFIG_SERVER_PORT}:8888"
    environment:
      - MONGO_DB_USERNAME=${MONGO_DB_USERNAME:-admin}
      - MONGO_DB_PASSWORD=${MONGO_DB_PASSWORD:-admin123}
      - MONGO_HOST=${MONGO_HOST:-localhost}
      - MONGO_DB_PORT=${MONGO_DB_PORT:-27017}
      - POSTGRESQL_HOST=${POSTGRESQL_HOST:-localhost}
      - POSTGRESQL_DB_PORT=${POSTGRESQL_DB_PORT:-5432}
      - POSTGRESQL_DB_USERNAME=${POSTGRESQL_DB_USERNAME:-postgres}
      - POSTGRESQL_DB_PASSWORD=${POSTGRESQL_DB_PASSWORD:-postgres123}
      - CUSTOMER_DB_NAME=${CUSTOMER_DB_NAME:-customer_db}
      - CART_DB_NAME=${CART_DB_NAME:-cart_db}
      - PRODUCT_DB_NAME=${PRODUCT_DB_NAME:-product_db}
    networks:
      - microservices
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8888/actuator/health" ]
      interval: 20s
      timeout: 3s
      retries: 5
    restart: on-failure

  discovery-server:
    build:
      context: ../../..
      dockerfile: discovery-server/Dockerfile
    depends_on:
      config-server:
        condition: service_healthy
    ports:
      - "${EUREKA_SERVER_PORT}:8761"
    environment:
      - SPRING_CONFIG_IMPORT=configserver:http://config-server:8888
    networks:
      - microservices
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8761/actuator/health" ]
      interval: 20s
      timeout: 3s
      retries: 5
    restart: on-failure

  customer-microservice:
    build:
      context: ../../..
      dockerfile: microservices/customer-microservice/Dockerfile
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    ports:
      - "${CUSTOMER_MICROSERVICE_PORT}:8091"
    environment:
      - SPRING_CONFIG_IMPORT=configserver:http://config-server:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - SPRING_MONGODB_URI=mongodb://${MONGO_DB_USERNAME:-admin}:${MONGO_DB_PASSWORD:-admin123}@${MONGO_HOST:-localhost}:${MONGO_DB_PORT:-27017}/${CUSTOMER_DB_NAME:-customer_db}?authSource=admin
    networks:
      - microservices

  product-microservice:
    build:
      context: ../../..
      dockerfile: microservices/product-microservice/Dockerfile
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    ports:
      - "${PRODUCT_MICROSERVICE_PORT}:8092"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://${POSTGRESQL_HOST}:${POSTGRESQL_DB_PORT}/${PRODUCT_DB_NAME}
      - SPRING_DATASOURCE_USERNAME=${POSTGRESQL_DB_USERNAME:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRESQL_DB_PASSWORD:-postgres123}
      - SPRING_CONFIG_IMPORT=configserver:http://config-server:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
    networks:
      - microservices

  cart-microservice:
    build:
      context: ../../..
      dockerfile: microservices/cart-microservice/Dockerfile
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    ports:
      - "${CART_MICROSERVICE_PORT}:8093"
    environment:
      - SPRING_CONFIG_IMPORT=configserver:http://config-server:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - SPRING_MONGODB_URI=mongodb://${MONGO_DB_USERNAME:-admin}:${MONGO_DB_PASSWORD:-admin123}@${MONGO_HOST:-localhost}:${MONGO_DB_PORT:-27017}/${CART_DB_NAME:-cart_db}?authSource=admin
    networks:
      - microservices



networks:
  microservices:
    driver: bridge
