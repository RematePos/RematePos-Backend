spring:
  config:
    import: ${SPRING_CONFIG_IMPORT:optional:configserver:${CONFIG_SERVER_URL:https://rematepos-config-server.onrender.com}}
  cloud:
    config:
      fail-fast: ${SPRING_CLOUD_CONFIG_FAIL_FAST:false}

security:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}

server:
  port: ${PORT:${AUTH_MICROSERVICE_PORT:8096}}

