databaseChangeLog:
  - changeSet:
      id: hu-181a-invoice-create-tenant-billing-settings
      author: codex
      preConditions:
        onFail: MARK_RAN
        not:
          tableExists:
            tableName: tenant_billing_settings
      changes:
        - createTable:
            tableName: tenant_billing_settings
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_tenant_billing_settings
                    nullable: false
              - column:
                  name: tenant_id
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: provider
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: provider_environment
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: enabled
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: base_url
                  type: VARCHAR(500)
              - column:
                  name: username
                  type: VARCHAR(255)
              - column:
                  name: token_encrypted
                  type: TEXT
              - column:
                  name: timeout_ms
                  type: INTEGER
              - column:
                  name: last_test_status
                  type: VARCHAR(255)
              - column:
                  name: last_test_message
                  type: TEXT
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: tenant_billing_settings
            columnNames: tenant_id
            constraintName: uk_tenant_billing_settings_tenant_id
        - createIndex:
            tableName: tenant_billing_settings
            indexName: idx_tenant_billing_settings_provider
            columns:
              - column:
                  name: provider
      rollback: []
