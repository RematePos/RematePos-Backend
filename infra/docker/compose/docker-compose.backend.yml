version: '3.8'

services:
  config-server:
    build:
      context: ../../..
      dockerfile: config-server/Dockerfile
    ports:
      - "${CONFIG_SERVER_PORT}:8888"
    networks:
      - microservices
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/actuator/health"]
      interval: 20s
      timeout: 3s
      retries: 5
    restart: on-failure

  discovery-server:
    build:
      context: ../../..
      dockerfile: discovery-server/Dockerfile
    depends_on:
      config-server:
        condition: service_healthy
    ports:
      - "${EUREKA_SERVER_PORT}:8761"
    environment:
      SPRING_CONFIG_IMPORT: "configserver:http://config-server:8888"
    networks:
      - microservices
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 20s
      timeout: 3s
      retries: 5
    restart: on-failure

  customer-microservice:
    build:
      context: ../../..
      dockerfile: microservices/customer-microservice/Dockerfile
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    ports:
      - "${CUSTOMER_MICROSERVICE_PORT}:8091"
    environment:
      SPRING_CONFIG_IMPORT: "configserver:http://config-server:8888"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://discovery-server:8761/eureka/"
      SPRING_MONGODB_URI: "mongodb://${MONGO_DB_USERNAME}:${MONGO_DB_PASSWORD}@${MONGO_HOST}:${MONGO_DB_PORT}/${CUSTOMER_DB_NAME}?authSource=admin"
    networks:
      - microservices
    restart: on-failure

  product-microservice:
    build:
      context: ../../..
      dockerfile: microservices/product-microservice/Dockerfile
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    ports:
      - "${PRODUCT_MICROSERVICE_PORT}:8092"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:postgresql://${POSTGRESQL_HOST}:${POSTGRESQL_DB_PORT}/${PRODUCT_DB_NAME}"
      SPRING_DATASOURCE_USERNAME: "${POSTGRESQL_DB_USERNAME}"
      SPRING_DATASOURCE_PASSWORD: "${POSTGRESQL_DB_PASSWORD}"
      SPRING_CONFIG_IMPORT: "configserver:http://config-server:8888"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://discovery-server:8761/eureka/"
    networks:
      - microservices
    restart: on-failure

  cart-microservice:
    build:
      context: ../../..
      dockerfile: microservices/cart-microservice/Dockerfile
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    ports:
      - "${CART_MICROSERVICE_PORT}:8093"
    environment:
      SPRING_CONFIG_IMPORT: "configserver:http://config-server:8888"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://discovery-server:8761/eureka/"
      SPRING_MONGODB_URI: "mongodb://${MONGO_DB_USERNAME}:${MONGO_DB_PASSWORD}@${MONGO_HOST}:${MONGO_DB_PORT}/${CART_DB_NAME}?authSource=admin"
    networks:
      - microservices
    restart: on-failure

networks:
  microservices:
    driver: bridge
