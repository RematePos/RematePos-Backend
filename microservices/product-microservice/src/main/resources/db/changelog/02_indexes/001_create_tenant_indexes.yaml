databaseChangeLog:
  - changeSet:
      id: hu-178b-product-index-products-tenant
      author: codex
      preConditions:
        onFail: MARK_RAN
        and:
          - tableExists:
              tableName: products
          - columnExists:
              tableName: products
              columnName: tenant_id
          - not:
              indexExists:
                indexName: idx_products_tenant_id
      changes:
        - createIndex:
            tableName: products
            indexName: idx_products_tenant_id
            columns:
              - column:
                  name: tenant_id
      rollback: []

  - changeSet:
      id: hu-178b-product-index-products-tenant-category
      author: codex
      preConditions:
        onFail: MARK_RAN
        and:
          - tableExists:
              tableName: products
          - columnExists:
              tableName: products
              columnName: tenant_id
          - not:
              indexExists:
                indexName: idx_products_tenant_category_id
      changes:
        - createIndex:
            tableName: products
            indexName: idx_products_tenant_category_id
            columns:
              - column:
                  name: tenant_id
              - column:
                  name: category_id
      rollback: []

  - changeSet:
      id: hu-178b-product-index-categories-tenant
      author: codex
