databaseChangeLog:
  - changeSet:
      id: hu-178b-purchase-index-purchases-tenant
      author: codex
      preConditions:
        onFail: MARK_RAN
        and:
          - tableExists:
              tableName: purchases
          - not:
              indexExists:
                indexName: idx_purchases_tenant_id
      changes:
        - createIndex:
            tableName: purchases
            indexName: idx_purchases_tenant_id
            columns:
              - column:
                  name: tenant_id
      rollback: []

