databaseChangeLog:
  - changeSet:
      id: hu-178b-auth-index-roles-name
      author: codex
      preConditions:
        onFail: MARK_RAN
        and:
          - tableExists:
              tableName: roles
          - not:
              indexExists:
                indexName: idx_roles_name
      changes:
        - createIndex:
            tableName: roles
            indexName: idx_roles_name
            columns:
              - column:
                  name: name
      rollback: []

