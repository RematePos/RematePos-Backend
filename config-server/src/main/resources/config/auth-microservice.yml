spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${POSTGRESQL_HOST:host.docker.internal}:${POSTGRESQL_DB_PORT:5432}/${AUTH_DB_NAME:auth_db}}
    username: ${SPRING_DATASOURCE_USERNAME:${POSTGRESQL_DB_USERNAME:change_me_pg_user}}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRESQL_DB_PASSWORD:change_me_pg_password}}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  liquibase:
    enabled: ${LIQUIBASE_ENABLED:true}
    change-log: classpath:db/changelog/db.changelog-master.yaml

security:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}

auth:
  demo-registration-enabled: ${AUTH_DEMO_REGISTRATION_ENABLED:false}
  seed-demo-users: ${AUTH_SEED_DEMO_USERS:false}
  demo-admin-password: ${AUTH_DEMO_ADMIN_PASSWORD:}
  demo-cashier-password: ${AUTH_DEMO_CASHIER_PASSWORD:}
  seed-platform-admin: ${AUTH_SEED_PLATFORM_ADMIN:false}
  platform-admin-username: ${AUTH_PLATFORM_ADMIN_USERNAME:platform.admin}
  platform-admin-password: ${AUTH_PLATFORM_ADMIN_PASSWORD:}
  platform-admin-email: ${AUTH_PLATFORM_ADMIN_EMAIL:platform.admin@example.com}

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://${EUREKA_SERVER_HOST:localhost}:${EUREKA_SERVER_PORT:8761}/eureka/}

logging:
  level:
    root: INFO
    com.corhuila.microservices: WARN
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n'
    file: '%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n'
  file:
    name: logs/auth-microservice.log
    max-size: 10MB
    max-history: 30

server:
  port: ${AUTH_MICROSERVICE_PORT:8096}
