spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${POSTGRESQL_HOST:host.docker.internal}:${POSTGRESQL_DB_PORT:5432}/${INVOICE_DB_NAME:invoice_db}}
    username: ${SPRING_DATASOURCE_USERNAME:${POSTGRESQL_DB_USERNAME:change_me_pg_user}}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRESQL_DB_PASSWORD:change_me_pg_password}}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  liquibase:
    enabled: ${LIQUIBASE_ENABLED:true}
    change-log: classpath:db/changelog/db.changelog-master.yaml

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}

logging:
  level:
    root: INFO
    com.corhuila.microservices: WARN

billing:
  provider: ${BILLING_PROVIDER:MOCK_DIAN}
  environment: ${BILLING_ENVIRONMENT:DEMO}
  demo-legend: ${BILLING_DEMO_LEGEND:Documento generado en ambiente de demostración, sin validez tributaria.}
  provider-base-url: ${BILLING_PROVIDER_BASE_URL:}
  provider-username: ${BILLING_PROVIDER_USERNAME:}
  provider-token: ${BILLING_PROVIDER_TOKEN:}
  provider-timeout-ms: ${BILLING_PROVIDER_TIMEOUT_MS:10000}
  factus:
    api-base-url: ${FACTUS_API_BASE_URL:}
    api-key: ${FACTUS_API_KEY:}
    client-id: ${FACTUS_CLIENT_ID:}
    client-secret: ${FACTUS_CLIENT_SECRET:}

server:
  port: 8095

