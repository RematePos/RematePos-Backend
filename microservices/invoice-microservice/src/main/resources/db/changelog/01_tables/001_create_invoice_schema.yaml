databaseChangeLog:
  - changeSet:
      id: hu-178b-invoice-create-invoices
      author: codex
      preConditions:
        onFail: MARK_RAN
        not:
          tableExists:
            tableName: invoices
      changes:
        - createTable:
            tableName: invoices
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: tenant_id
                  type: VARCHAR(255)
              - column:
                  name: purchase_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: invoice_number
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: customer_id
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: customer_document_type
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: customer_document_number
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: customer_full_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: subtotal
                  type: DECIMAL(14, 2)
                  constraints:
                    nullable: false
              - column:
                  name: tax
                  type: DECIMAL(14, 2)
                  constraints:
                    nullable: false
              - column:
                  name: total
                  type: DECIMAL(14, 2)
                  constraints:
                    nullable: false
              - column:
                  name: issued_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: provider
                  type: VARCHAR(255)
              - column:
                  name: provider_environment
                  type: VARCHAR(255)
              - column:
                  name: provider_status
                  type: VARCHAR(255)
              - column:
                  name: provider_reference
                  type: VARCHAR(255)
              - column:
                  name: cufe
                  type: VARCHAR(255)
              - column:
                  name: cude
                  type: VARCHAR(255)
              - column:
                  name: qr_code
                  type: TEXT
              - column:
                  name: xml_content
                  type: TEXT
              - column:
                  name: pdf_url
                  type: VARCHAR(255)
              - column:
                  name: fiscal_valid
                  type: BOOLEAN
              - column:
                  name: validation_message
                  type: TEXT
      rollback: []

  - changeSet:
      id: hu-178b-invoice-create-invoice-items
      author: codex
      preConditions:
        onFail: MARK_RAN
        not:
          tableExists:
            tableName: invoice_items
      changes:
        - createTable:
            tableName: invoice_items
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: invoice_id
                  type: BIGINT
              - column:
                  name: product_id
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: product_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: quantity
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: unit_price
                  type: DECIMAL(14, 2)
                  constraints:
                    nullable: false
              - column:
                  name: line_total
                  type: DECIMAL(14, 2)
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: invoice_items
            baseColumnNames: invoice_id
            referencedTableName: invoices
            referencedColumnNames: id
            constraintName: fk_invoice_items_invoice
      rollback: []
